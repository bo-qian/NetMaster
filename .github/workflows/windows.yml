name: Windows validation
on:
  push:
    branches: [main, feature/winui3-windows]
  pull_request:
    paths: ['windows/**', 'tools/**', 'assets/branding/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test isolated business logic
        run: dotnet test windows/NetMaster.Core.Tests/NetMaster.Core.Tests.csproj --logger trx -v:minimal
      - name: Test portal interception and layout
        run: node --test tools/tests/portal-capture.test.cjs tools/tests/portal-layout.test.cjs
      - name: Build development app without packaging
        run: dotnet build windows/NetMaster/NetMaster.csproj -p:Platform=x64 -p:WindowsPackageType=None -p:GenerateAppxPackageOnBuild=false -p:OutDir=${{ github.workspace }}/windows/NetMaster/bin/ci-preview/ -v:minimal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-test-results
          path: windows/NetMaster.Core.Tests/TestResults/*.trx
